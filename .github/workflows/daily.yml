name: Forex signals

on:
  schedule:
    - cron: "*/5 5-16 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: signal-bot

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python bot.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          TWELVEDATA_KEY: ${{ secrets.TWELVEDATA_KEY }}
      - name: Save the signal log
        run: |
          git config user.name "signal-bot"
          git config user.email "bot@users.noreply.github.com"
          git add signals.csv last_summary.txt
          git commit -m "Update signals" || echo "No changes"
          git push
